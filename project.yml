name: FitClaude
options:
  bundleIdPrefix: it.fitclaude
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FitClaude:
    type: application
    platform: iOS
    sources:
      - path: FitClaude
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.fitclaude.app
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_FILE: FitClaude/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Imposta qui il tuo Team ID oppure sceglilo in Xcode (Signing & Capabilities)
        DEVELOPMENT_TEAM: ""
